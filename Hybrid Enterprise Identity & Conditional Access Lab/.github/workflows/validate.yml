name: Identity-as-Code CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-policies:
    name: "Declarative Policy Schema & Baseline Gate"
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Conditional Access Policy Schema
        shell: pwsh
        run: |
          Write-Host "Running Schema & Baseline Pre-Flight Validation..." -ForegroundColor Cyan
          ./scripts/deploy_ca_policies.ps1 -ValidateOnly

  pester-tests:
    name: "Automated Pester Unit & Governance Tests"
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Pester Test Suites
        shell: pwsh
        run: |
          $pesterConfig = [PesterConfiguration]::Default
          $pesterConfig.Run.Path = "tests"
          $pesterConfig.Output.Verbosity = "Detailed"
          Invoke-Pester -Configuration $pesterConfig

  static-analysis:
    name: "PSScriptAnalyzer Static Code Quality"
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run PSScriptAnalyzer Linting
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings .psscriptanalyzer.psd1
          if ($results) {
            $results | Format-Table ScriptName, Line, Message, Severity -AutoSize
            $issues = $results | Where-Object { $_.Severity -in @("Error", "Warning") }
            if ($issues.Count -gt 0) {
              Write-Error "Static analysis detected $($issues.Count) issues (Errors and Warnings are blocking gates)."
              exit 1
            }
          } else {
            Write-Host "PSScriptAnalyzer passed with zero errors or warnings!" -ForegroundColor Green
          }

  secret-scanning:
    name: "Repository Hygiene & Secret Scanning Gate"
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify No Secrets Committed
        shell: pwsh
        run: |
          $prohibitedFiles = @(
            "config/tenant.json",
            "config/environment.json",
            "config/identity-mapping.json"
          )
          foreach ($file in $prohibitedFiles) {
            if (Test-Path $file) {
              Write-Error "CRITICAL: Live credentials file '$file' detected in repository!"
              exit 1
            }
          }
          Write-Host "Secret scanning gate passed: No sensitive configuration files committed." -ForegroundColor Green
