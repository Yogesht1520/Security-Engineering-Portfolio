# =============================================================================
# logging.conf — rsyslog routing for Zero-Trust firewall deny events
# =============================================================================
# PURPOSE
#   Route nftables "ZT-DENY-*" log entries to a dedicated file for:
#     - Screenshot evidence capture (TEST_EVIDENCE.md)
#     - SIEM integration (forward /var/log/zt-evidence/ to your SIEM)
#     - Audit trail (do not rotate without archiving)
#
# INSTALLATION
#   sudo cp logging.conf /etc/rsyslog.d/99-zt-firewall.conf
#   sudo systemctl restart rsyslog
#
# HOW IT WORKS
#   nftables sends kernel log messages via the kernel ring buffer.
#   rsyslog picks them up from kern.* facility and filters by message content.
#   Matching lines (containing "ZT-DENY") are written to the evidence file
#   AND forwarded to the kern facility log. The "& stop" prevents double-logging.
#
# LOG FORMAT (example)
#   Sep 26 00:15:03 gateway kernel: ZT-DENY-CONTRACTOR-PROD: IN=wg0 OUT=veth-ns-prod
#     SRC=10.0.0.4 DST=10.10.2.2 LEN=60 TOS=0x00 PREC=0x00 TTL=63 ID=12345
#     DF PROTO=TCP SPT=54321 DPT=8080 WINDOW=64240 RES=0x00 SYN URGP=0
#
# LOG PREFIX → MEANING
#   ZT-DENY-CONTRACTOR-PROD:  Contractor attempted Prod access (BLOCKED)
#   ZT-DENY-CONTRACTOR-HR:    Contractor attempted HR access (BLOCKED)
#   ZT-DENY-DEV-TO-PROD:      Developer attempted Prod access (BLOCKED)
#   ZT-DENY-DEV-TO-HR:        Developer attempted HR access (BLOCKED)
#   ZT-DENY-UNMATCHED:        Unknown source attempted forwarding (BLOCKED)
#   ZT-INPUT-DENY:            Something attempted direct gateway access (BLOCKED)
# =============================================================================

# ── Route all ZT-DENY messages to the evidence log ──────────────────────────
:msg, contains, "ZT-DENY"  /var/log/zt-evidence/firewall-denies.log
& stop

# ── Route all ZT-INPUT messages to the evidence log ─────────────────────────
:msg, contains, "ZT-INPUT-DENY"  /var/log/zt-evidence/firewall-denies.log
& stop

# ── Optional: forward deny events to a SIEM (uncomment to enable) ───────────
# :msg, contains, "ZT-DENY" @@<SIEM-HOST>:514
# & stop

# ── Log rotation hint ────────────────────────────────────────────────────────
# Add to /etc/logrotate.d/zt-firewall:
#
#   /var/log/zt-evidence/firewall-denies.log {
#     daily
#     rotate 90
#     compress
#     delaycompress
#     missingok
#     notifempty
#     postrotate
#       /usr/lib/rsyslog/rsyslog-rotate
#     endscript
#   }
