#!/usr/sbin/nft -f
# =============================================================================
# nftables.conf — Zero-Trust Network Segmentation Enforcement
# =============================================================================
# PURPOSE
#   This is LAYER 2 of the dual-enforcement zero-trust model.
#   LAYER 1 (AllowedIPs in WireGuard peer configs) controls what the WireGuard
#   kernel module routes. LAYER 2 (this file) is fully server-side and
#   independently enforces the same segmentation policy at the gateway firewall.
#
#   The key insight: if AllowedIPs were misconfigured (admin error, compromised
#   endpoint, or deliberate bypass), traffic would reach the gateway but THESE
#   RULES would still DENY and LOG it. You cannot bypass both layers by
#   manipulating only the client-side config.
#
# REFERENCE: NIST SP 800-207 §2.1 — "Never trust a single control point."
#
# ARCHITECTURE
#   Internet → Gateway VM (wg0 WireGuard interface) → nftables forward chain
#              → segment veth pairs → Linux network namespaces
#
# IP MAP
#   WireGuard VPN subnet:   10.0.0.0/24
#     10.0.0.1  = gateway
#     10.0.0.2  = Admin peer    (full access: Dev + Prod + HR)
#     10.0.0.3  = Developer     (Dev only)
#     10.0.0.4  = Contractor    (Dev only — most restricted)
#
#   Segment subnets:
#     10.10.1.0/24  = Dev segment
#     10.10.2.0/24  = Prod segment
#     10.10.3.0/24  = Corp-HR segment
#
# LOG PREFIX CONVENTION
#   All DENY rules use "ZT-DENY-<PEER>-<SEGMENT>:" prefix for easy grep/SIEM.
#   Example: "ZT-DENY-CONTRACTOR-PROD: " appears in /var/log/kern.log and
#   journalctl -k, and is routed to /var/log/zt-evidence/firewall-denies.log
#   by rsyslog (see logging.conf).
#
# HOW TO READ THIS FILE
#   Read each named set as a group of IPs, then read the chain rules top-down.
#   First matching rule wins. Default policy = DROP.
# =============================================================================

# Flush any existing zt_filter table (idempotent)
# (The wg_nat table is managed separately by wg0 PostUp/PostDown)

table inet zt_filter {

  # ─────────────────────────────────────────────────────────────────────────
  # Named sets — DRY definitions of each segment's CIDR block.
  # Updating a segment's IP range only requires changing it here.
  # ─────────────────────────────────────────────────────────────────────────

  set dev_segment {
    type ipv4_addr
    flags interval
    comment "Dev segment — 10.10.1.0/24"
    elements = { 10.10.1.0/24 }
  }

  set prod_segment {
    type ipv4_addr
    flags interval
    comment "Prod segment — 10.10.2.0/24"
    elements = { 10.10.2.0/24 }
  }

  set hr_segment {
    type ipv4_addr
    flags interval
    comment "Corp-HR segment — 10.10.3.0/24"
    elements = { 10.10.3.0/24 }
  }

  set all_segments {
    type ipv4_addr
    flags interval
    comment "All three segments — used for admin blanket allow"
    elements = {
      10.10.1.0/24,  # Dev
      10.10.2.0/24,  # Prod
      10.10.3.0/24   # Corp-HR
    }
  }

  # ─────────────────────────────────────────────────────────────────────────
  # FORWARD CHAIN — enforces zero-trust segmentation
  # Applies to: all packets forwarded through the gateway between
  #             wg0 (VPN tunnel) and the segment veth interfaces.
  # Default policy: DROP (deny by default, explicit allow required).
  # ─────────────────────────────────────────────────────────────────────────
  chain forward {
    type filter hook forward priority filter; policy drop;

    # ── RULE 1: Allow established/related sessions ────────────────────────
    # Required for return traffic (TCP ACK, UDP replies) to flow back through.
    # Without this, every response packet would be dropped.
    ct state established,related accept \
      comment "allow return traffic for established sessions"

    # ── RULE 2: Admin peer — FULL access to all segments ─────────────────
    # Admin (10.0.0.2) may reach any of the three segment subnets.
    # This is the ONLY peer with cross-segment visibility.
    # Mitigation for key compromise: hardware token + quarterly rotation.
    ip saddr 10.0.0.2 ip daddr @all_segments accept \
      comment "admin peer (10.0.0.2) — authorized full segment access"

    # Admin → gateway management (wg0 IP)
    ip saddr 10.0.0.2 ip daddr 10.0.0.1 accept \
      comment "admin peer — gateway wg0 management access"

    # ── RULE 3: Developer peer — Dev segment ONLY ─────────────────────────
    ip saddr 10.0.0.3 ip daddr @dev_segment accept \
      comment "developer (10.0.0.3) — Dev segment authorized"

    # Developer → Prod: DENY + LOG
    # Log prefix used by rsyslog to route to dedicated deny log file.
    ip saddr 10.0.0.3 ip daddr @prod_segment \
      log prefix "ZT-DENY-DEV-TO-PROD: " flags all \
      drop \
      comment "developer → Prod DENIED (zero-trust boundary)"

    # Developer → Corp-HR: DENY + LOG
    ip saddr 10.0.0.3 ip daddr @hr_segment \
      log prefix "ZT-DENY-DEV-TO-HR: " flags all \
      drop \
      comment "developer → Corp-HR DENIED (zero-trust boundary)"

    # ── RULE 4: Contractor peer — Dev segment ONLY ────────────────────────
    # ⚠ DEFENSE-IN-DEPTH CRITICAL RULE ⚠
    # These DENY+LOG rules catch the Phase 3 test case: even if contractor's
    # AllowedIPs is widened to 10.0.0.0/8 on the client side, these server-side
    # nftables rules independently DENY access to Prod and HR, and LOG evidence.
    # The firewall knows nothing about AllowedIPs — it sees the decrypted
    # source IP (10.0.0.4) and applies policy based solely on that.
    ip saddr 10.0.0.4 ip daddr @dev_segment accept \
      comment "contractor (10.0.0.4) — Dev segment authorized"

    # Contractor → Prod: DENY + LOG (CATCHES AllowedIPs misconfig)
    ip saddr 10.0.0.4 ip daddr @prod_segment \
      log prefix "ZT-DENY-CONTRACTOR-PROD: " flags all \
      drop \
      comment "contractor → Prod DENIED (defense-in-depth; catches AllowedIPs widening)"

    # Contractor → Corp-HR: DENY + LOG (CATCHES AllowedIPs misconfig)
    ip saddr 10.0.0.4 ip daddr @hr_segment \
      log prefix "ZT-DENY-CONTRACTOR-HR: " flags all \
      drop \
      comment "contractor → HR DENIED (defense-in-depth; catches AllowedIPs widening)"

    # ── RULE 5: Catch-all — log and drop everything else ─────────────────
    # Any forwarded packet not matching rules 1–4 is an anomaly.
    # Log it for investigation; do NOT silently drop.
    log prefix "ZT-DENY-UNMATCHED: " flags all \
      drop \
      comment "default deny — log unrecognized forwarded traffic for audit"
  }

  # ─────────────────────────────────────────────────────────────────────────
  # INPUT CHAIN — protects the gateway host itself
  # ─────────────────────────────────────────────────────────────────────────
  chain input {
    type filter hook input priority filter; policy drop;

    # Loopback: always required
    iif lo accept comment "loopback — always allow"

    # Established/related sessions back to gateway
    ct state established,related accept

    # WireGuard UDP — peers connect on this port from the internet
    udp dport 51820 accept comment "WireGuard inbound (UDP 51820)"

    # SSH management — HARDEN in production: restrict to admin egress IP
    # Example: ip saddr <YOUR-ADMIN-IP> tcp dport 22 accept
    tcp dport 22 accept comment "SSH — restrict src IP in production"

    # ICMP echo (ping) — useful for reachability testing
    icmp type echo-request accept comment "ICMP ping — for diagnostics"
    ip6 nexthdr icmpv6 accept

    # Everything else: log and drop
    log prefix "ZT-INPUT-DENY: " drop comment "default input deny"
  }

  # ─────────────────────────────────────────────────────────────────────────
  # OUTPUT CHAIN — gateway outbound (open for lab; tighten in production)
  # ─────────────────────────────────────────────────────────────────────────
  chain output {
    type filter hook output priority filter; policy accept;
    # In production: restrict gateway's own outbound to necessary services only.
  }
}
