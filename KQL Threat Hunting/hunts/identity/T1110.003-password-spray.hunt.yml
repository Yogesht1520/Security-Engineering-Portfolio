id: HB-ID-001
title: Password spray against multiple accounts from a single IP
status: tested
validation_level: synthetic
platform: sentinel
tables:
  - SigninLogs
time_column: TimeGenerated
attack:
  tactics:
    - credential-access
  techniques:
    - T1110.003
severity: medium
hypothesis: >
  An adversary attempts a small list of commonly used passwords (e.g. SeasonYear!, Welcome123)
  against dozens or hundreds of different user accounts from a single source IP to remain
  under the smart lockout threshold of individual accounts.
logic_summary: >
  Filters SigninLogs for failed authentications caused by invalid credentials (ResultType 50126),
  groups them by source IP address into tumbling time windows (bin), and flags any single IP
  that hits a threshold of distinct user accounts (dcount).
parameters:
  - name: lookback
    default: 1d
    description: Historical search window to inspect
  - name: window
    default: 30m
    description: Tumbling time bucket window for grouping spray attempts
  - name: minUsers
    default: 10
    description: Minimum number of unique accounts targeted to trigger a hunting lead
false_positives:
  - Corporate egress proxies or shared NAT gateways where multiple employees misconfigure credentials simultaneously
  - Enterprise single sign-on (SSO) cutover, active directory sync jobs, or mass password reset days
tuning:
  - Exclude verified corporate external NAT egress IP ranges or VPN gateways using a Sentinel watchlist
  - Increase the minUsers threshold in large enterprise environments (>5,000 active users) to 25 or 50
triage_steps:
  - Check whether any account targeted by this IP had a subsequent successful login (ResultType 0)
  - Examine the source IP threat reputation, ISP, ASN, and user agent string for automation fingerprints
  - Determine if the targeted accounts belong to privileged roles (e.g. Global Admins, Conditional Access Admins)
response: >
  Block the attacking IP address on perimeter firewalls / Conditional Access named locations,
  and trigger an immediate password reset and session revocation for any user that logged in successfully.
references:
  - title: MITRE ATT&CK T1110.003 Password Spraying
    url: https://attack.mitre.org/techniques/T1110/003/
  - title: Microsoft Entra Sign-in Error Codes (50126)
    url: https://learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-sign-ins-error-codes
tests:
  - dataset: scenario-01
    expect:
      min_rows: 1
      contains:
        IPAddress: 203.0.113.50
  - dataset: baseline
    expect:
      max_rows: 0
author: Yogesh Thakur
created: 2026-11-05

