id: HB-EP-006
title: Windows security or system event log cleared
status: tested
validation_level: synthetic
platform: defender-xdr
tables:
  - DeviceEvents
time_column: Timestamp
attack:
  tactics:
    - defense-evasion
  techniques:
    - T1070.001
severity: high
hypothesis: >
  An adversary executes anti-forensic commands via wevtutil or PowerShell to wipe Security, System,
  or PowerShell event logs, covering their tracks following lateral movement or credential theft.
logic_summary: >
  Monitors DeviceEvents for the EventLogCleared action type or process executions of wevtutil.exe
  invoking clear-log (cl) commands.
parameters:
  - name: lookback
    default: 7d
    description: Historical search window to inspect
false_positives:
  - Routine system maintenance scripts in dedicated test labs or automated virtual machine image build pipelines
  - Highly uncommon automated IT log rotation scripts
tuning:
  - Whitelist dedicated automated Golden Image build environments (e.g. Packer / Azure Image Builder)
  - Alert immediately on any production server or domain controller clearing the Security log
triage_steps:
  - Identify which specific log was cleared (Security, System, PowerShellCore, etc.)
  - Review the user account and initiating command line that executed the clear command
  - Examine previous activities performed on that host prior to the log deletion
response: >
  Isolate the endpoint immediately, preserve forensic RAM and disk artifacts, and treat the event as active compromise.
references:
  - title: MITRE ATT&CK T1070.001 Indicator Removal on Host - Clear Windows Event Logs
    url: https://attack.mitre.org/techniques/T1070/001/
  - title: Microsoft Defender Advanced Hunting DeviceEvents
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-deviceevents-table
tests:
  - dataset: scenario-02
    expect:
      min_rows: 0
  - dataset: baseline
    expect:
      max_rows: 0
author: Yogesh Thakur
created: 2026-11-05

