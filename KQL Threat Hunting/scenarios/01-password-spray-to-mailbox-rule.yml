id: scenario-01
title: Password spray against multiple accounts followed by successful login, anomalous travel, and inbox forwarding rule
seed: 1337
window:
  start: "2026-01-10T08:00:00Z"
  duration: 6h
baseline:
  users: 50
  tables:
    - SigninLogs
    - CloudAppEvents
steps:
  # Step 1: Attacker IP 203.0.113.50 sprays 40 accounts with invalid passwords (ResultType 50126)
  - at: "+01:10"
    actor: "203.0.113.50"
    action: spray
    targets: 40
    table: SigninLogs
    attack: T1110.003
    details:
      resultType: "50126"
      resultDescription: "Error validating credentials due to invalid username or password."

  # Step 2: Attacker successfully authenticates to victim user017@contoso.test from Germany
  - at: "+01:40"
    actor: "203.0.113.50"
    action: success
    user: user017@contoso.test
    table: SigninLogs
    attack: T1078
    details:
      resultType: "0"
      location: "DE"
      app: "Office 365 Exchange Online"

  # Step 3: Legitimate user signs in from original work location (US) only 20 minutes later (Impossible Travel)
  - at: "+02:00"
    actor: "198.51.100.25"
    action: success
    user: user017@contoso.test
    table: SigninLogs
    attack: T1078
    details:
      resultType: "0"
      location: "US"
      app: "Microsoft Teams"

  # Step 4: Attacker session creates a malicious inbox rule forwarding invoices to external email
  - at: "+02:15"
    actor: "203.0.113.50"
    action: new_inbox_rule
    user: user017@contoso.test
    table: CloudAppEvents
    attack: T1114.003
    details:
      application: "Microsoft Exchange Online"
      ruleParameters: "ForwardTo: attacker@evil.example; DeleteMessage: true"

