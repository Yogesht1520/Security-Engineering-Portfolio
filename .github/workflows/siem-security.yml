name: Security & Secret Gate

on:
  push:
    paths:
      - 'siem-detection-lab/**'
      - '.github/workflows/siem-security.yml'
  pull_request:
    paths:
      - 'siem-detection-lab/**'
      - '.github/workflows/siem-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    name: Repository Security & Credential Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: siem-detection-lab

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Security & Secret Audit
        run: python tests/security_scan.py
