name: Identity-as-Code CI/CD Pipeline

on:
  push:
    paths:
      - 'Hybrid Enterprise Identity & Conditional Access Lab/**'
    branches: [ main ]
  pull_request:
    paths:
      - 'Hybrid Enterprise Identity & Conditional Access Lab/**'
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-policies:
    name: "Declarative Policy Schema & Baseline Gate"
    runs-on: windows-latest
    defaults:
      run:
        working-directory: 'Hybrid Enterprise Identity & Conditional Access Lab'
    timeout-minutes: 15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Conditional Access Policy Schema & Engine Pre-Flight
        shell: pwsh
        run: |
          Write-Host "Running Deep Schema Validation & Baseline Pre-Flight..." -ForegroundColor Cyan
          ./scripts/deployment/validate_schema.ps1
          ./scripts/deployment/deploy_ca_policies.ps1 -ValidateOnly

  master-test-matrix:
    name: "Comprehensive Master Test Suite & Pester Matrix"
    runs-on: windows-latest
    defaults:
      run:
        working-directory: 'Hybrid Enterprise Identity & Conditional Access Lab'
    timeout-minutes: 15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Pinned Test Dependencies (Pester 5.5.0)
        shell: pwsh
        run: |
          Write-Host "Enforcing exact Pester version 5.5.0 for reproducible CI..." -ForegroundColor Cyan
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -eq '5.5.0' })) {
            Install-Module -Name Pester -RequiredVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          }
          Import-Module Pester -RequiredVersion 5.5.0 -Force
          $importedPester = (Get-Module Pester).Version.ToString()
          if ($importedPester -ne '5.5.0') {
            Write-Error "Pester version mismatch: expected 5.5.0, got $importedPester"
            exit 1
          }
          Write-Host "Pester 5.5.0 verified and imported successfully." -ForegroundColor Green

      - name: Execute Master Test Runner & Generate Reproducible Evidence
        shell: pwsh
        run: |
          Write-Host "Executing Master Test Runner (9 Suites & Native Pester Assertions)..." -ForegroundColor Cyan
          $result = & pwsh -NoProfile -ExecutionPolicy Bypass -File tests/run_all_tests.ps1 -ExportEvidence
          $result
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Master test runner failed with exit code $LASTEXITCODE."
            exit $LASTEXITCODE
          }

      - name: Upload Test Evidence and Telemetry Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: test-results-and-evidence-${{ github.run_id }}-${{ github.sha }}
          path: |
            Hybrid Enterprise Identity & Conditional Access Lab/evidence/test-results.json
            Hybrid Enterprise Identity & Conditional Access Lab/evidence/policy-behavior-matrix.md
            Hybrid Enterprise Identity & Conditional Access Lab/evidence/live-tenant-state/live-tenant-state.json

  static-analysis:
    name: "PSScriptAnalyzer Static Code Quality"
    runs-on: windows-latest
    defaults:
      run:
        working-directory: 'Hybrid Enterprise Identity & Conditional Access Lab'
    timeout-minutes: 15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run PSScriptAnalyzer Linting (Pinned 1.22.0)
        shell: pwsh
        run: |
          Write-Host "Enforcing exact PSScriptAnalyzer version 1.22.0 for reproducible CI..." -ForegroundColor Cyan
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer | Where-Object { $_.Version -eq '1.22.0' })) {
            Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.22.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          Import-Module PSScriptAnalyzer -RequiredVersion 1.22.0 -Force
          $importedPSSA = (Get-Module PSScriptAnalyzer).Version.ToString()
          if ($importedPSSA -ne '1.22.0') {
            Write-Error "PSScriptAnalyzer version mismatch: expected 1.22.0, got $importedPSSA"
            exit 1
          }
          Write-Host "PSScriptAnalyzer 1.22.0 verified and imported successfully." -ForegroundColor Green
          $settingsPath = Join-Path $PWD ".psscriptanalyzer.psd1"
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings $settingsPath
          $issues = @($results | Where-Object { $_.Severity -in @("Error", "Warning") })
          if ($issues.Count -gt 0) {
            $issues | Format-Table ScriptName, Line, RuleName, Message, Severity -AutoSize
            Write-Error "Static analysis detected $($issues.Count) issues (Errors and Warnings are blocking gates)."
            exit 1
          } else {
            Write-Host "PSScriptAnalyzer passed with zero errors or warnings!" -ForegroundColor Green
          }

  secret-scanning:
    name: "Repository Hygiene & Secret Scanning Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify No Sensitive Files Committed
        shell: bash
        run: |
          foundSensitive=$(find . -type f \( -name "tenant.json" -o -name "environment.json" -o -name "identity-mapping.json" \) 2>/dev/null)
          if [ -n "$foundSensitive" ]; then
            echo "CRITICAL: Prohibited sensitive live config file(s) found in repository:"
            echo "$foundSensitive"
            exit 1
          fi
          echo "Secret scanning gate passed: No sensitive configuration files committed anywhere in repository."
