name: Validate Shell Scripts

on:
  push:
    paths:
      - '**/*.sh'
      - '.github/workflows/validate-shell.yml'
  pull_request:
    paths:
      - '**/*.sh'
      - '.github/workflows/validate-shell.yml'

permissions:
  contents: read

jobs:
  shellcheck:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run ShellCheck
        run: |
          echo "Scanning all repository shell scripts..."
          find . -name "*.sh" -not -path "./.terraform/*" -print0 | xargs -0 shellcheck --severity=warning
