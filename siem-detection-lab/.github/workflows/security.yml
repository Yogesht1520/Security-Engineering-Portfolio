name: Security & Secret Gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security-scan:
    name: Repository Security & Credential Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Execute Security & Secret Audit
        run: python tests/security_scan.py
